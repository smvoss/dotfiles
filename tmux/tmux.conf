set-option -g default-shell /usr/bin/zsh

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix `
bind-key ` send-prefix

set -sg escape-time 0

# Swap the current window to 0th position
bind-key T swap-window -t 0

# switch panes using Alt-arrow without prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

bind-key u attach-session -t . -c '#{pane_current_path}' \; display-message "Updated default dir to #{pane_current_path}"

set -g popup-border-lines double
set -g popup-border-style 'fg=colour208,bg=default'

bind-key q display-popup -w 80% -h 80% -E "q chat"

# Toggle popup with a persistent session named "scratch"
bind -n C-f if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E "tmux attach-session -t scratch || mkdir -p ${HOME}/scratch; tmux new-session -s scratch -c ${HOME}/scratch"
}

# enable vi mode keys
set-window-option -g mode-keys vi

# Enable mouse control
#set -g mouse-select-window on
#set -g mouse-select-pane on
#set -g mouse-resize-pane on

# set default terminal mode to 256 colors
set-option -g default-terminal "xterm-256color"
set-option -a terminal-features ",xterm-256color:Tc"

# Turn on mouse scolling in copy mode
#setw -g mode-mouse on

# reload the tmux configuration file and display a message saying reloaded
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# quick open the tmux config file
bind-key M split-window -h "vim ~/.tmux.conf"

# clear all windows
#bind -n C-k clear-history \; display-message "cleared history"
#bind -n C-k send-keys -R \; send-keys C-l \; clear-history

# once I rename, I dont want other things to rename too..
set-option -g allow-rename off

# Session persistence (resurrect + continuum)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux